name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build with buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: |
            if [ ! -f buildozer.spec ]; then buildozer init; fi
            sed -i 's/^requirements = .*/requirements = python3,kivy,arabic_reshaper,python-bidi/' buildozer.spec
            sed -i 's/^#source.include_exts = .*/source.include_exts = py,png,jpg,kv,atlas,ttf/' buildozer.spec
            sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ steps.buildozer.outputs.filename }}
